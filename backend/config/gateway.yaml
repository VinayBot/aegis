# AEGIS gateway configuration. Hot-reloaded when this file changes (no restart).
#
# `${NAME:-default}` reads the environment: AEGIS_MODEL_HOST=host.docker.internal points every
# backend at the host's model servers when the gateway runs in a container.
#
# Clients send a public model name (`models:`). Each model maps to an ordered chain of backends;
# the router tries them in this order. Any OpenAI-compatible server is one `backends:` entry, so
# pointing at vLLM on a GPU box later is one block (see `vllm-gpu` below).

backends:
  mlx-qwen:
    kind: openai                     # any OpenAI-compatible /v1 server
    label: MLX primary
    base_url: http://${AEGIS_MODEL_HOST:-127.0.0.1}:8081/v1
    model: mlx-community/Qwen2.5-3B-Instruct-4bit
    slots: 4                         # mlx-lm 0.32 batches; measured: x3.5 throughput at 4, flat beyond (make bench-serving)
    process: mlx                     # var/run/mlx.pid: lets the chaos lab SIGSTOP the real process
    provider: mlx
    # The provider's real defaults. They become part of the cache key when a client omits them.
    defaults: {temperature: 0.0, top_p: 1.0, max_tokens: 512}

  ollama-llama:
    kind: openai
    label: Ollama fallback
    base_url: http://${AEGIS_MODEL_HOST:-127.0.0.1}:11434/v1
    model: llama3.2:3b
    slots: 2
    provider: ollama
    defaults: {temperature: 0.8, top_p: 0.9, max_tokens: 512}

  litellm-ollama:
    kind: litellm                    # optional adapter: `uv sync --extra litellm`
    label: LiteLLM adapter
    model: ollama_chat/llama3.2:3b
    api_base: http://${AEGIS_MODEL_HOST:-127.0.0.1}:11434
    slots: 1
    provider: litellm
    defaults: {temperature: 0.8, top_p: 0.9, max_tokens: 512}

  litellm-proxy:
    kind: openai                     # the real LiteLLM proxy server (infra/litellm/config.yaml)
    label: LiteLLM proxy
    base_url: http://${AEGIS_MODEL_HOST:-127.0.0.1}:4000/v1
    model: llama3.2-3b               # LiteLLM's model_name; it routes to Ollama
    api_key_env: LITELLM_MASTER_KEY  # the proxy's key comes from the environment, not this file
    slots: 2
    provider: litellm-proxy
    optional: true
    defaults: {temperature: 0.8, top_p: 0.9, max_tokens: 512}

  vllm-metal:
    kind: openai                     # real vLLM (V1 engine, paged attention, continuous batching)
    label: vLLM (Metal)
    base_url: http://${AEGIS_MODEL_HOST:-127.0.0.1}:8090/v1   # vllm serve ... via the vllm-metal plugin (scripts/dev.sh)
    model: qwen2.5-0.5b              # --served-model-name; weights mlx-community/Qwen2.5-0.5B-Instruct-4bit
    slots: 8                         # continuous batching: many requests share each forward pass
    provider: vllm
    optional: true
    defaults: {temperature: 1.0, top_p: 1.0, max_tokens: 512}   # vLLM defaults (this snapshot ships no generation_config)

  # vllm-gpu:                        # vLLM on a GPU box is this one entry
  #   kind: openai
  #   label: vLLM GPU
  #   base_url: http://gpu-box:8000/v1
  #   model: Qwen/Qwen2.5-7B-Instruct
  #   slots: 16
  #   provider: vllm
  #   defaults: {temperature: 0.7, top_p: 1.0, max_tokens: 512}

models:
  aegis-chat:
    chain: [mlx-qwen, ollama-llama]
    # "est. cloud equivalent": what the same tokens would cost on a hosted model. Local inference
    # has no bill; this is the counterfactual used for savings. Reference: gpt-4o-mini list price.
    price: {input_per_1m: 0.15, output_per_1m: 0.60, reference: gpt-4o-mini list price}
  aegis-fallback:
    chain: [ollama-llama]
    price: {input_per_1m: 0.15, output_per_1m: 0.60, reference: gpt-4o-mini list price}
  aegis-litellm:
    chain: [litellm-ollama, ollama-llama]
    price: {input_per_1m: 0.15, output_per_1m: 0.60, reference: gpt-4o-mini list price}
  aegis-vllm:
    chain: [vllm-metal, ollama-llama]
    price: {input_per_1m: 0.15, output_per_1m: 0.60, reference: gpt-4o-mini list price}
  aegis-litellm-proxy:
    chain: [litellm-proxy, ollama-llama]
    price: {input_per_1m: 0.15, output_per_1m: 0.60, reference: gpt-4o-mini list price}

# API keys. `id` is the public name used in logs, metrics, the ledger and the API; the key itself
# never leaves the auth check. These are local demo keys, readable on purpose. In production store
# each key as its hash (`uv run python -m aegis.security hash <key>` prints the entry), e.g.
#   "sha256:9f86d0...":  {id: acme, tenant: acme, tpm: 60000, budget: {soft: 50, hard: 100}}
# `role: admin` grants the control plane; the admin credential normally comes from AEGIS_ADMIN_KEY.
keys:
  aegis-demo-key:      {id: demo,      tenant: demo,        tpm: 30000, budget: {soft: 0.50, hard: 1.00}}
  aegis-assistant-key: {id: assistant, tenant: aegis-bot,   tpm: 60000, budget: {soft: 0.50, hard: 1.00}}
  aegis-flood-key:     {id: flood,     tenant: flood-test,  tpm: 1500,  budget: {soft: 0.50, hard: 1.00}}
  aegis-budget-key:    {id: budget,    tenant: budget-test, tpm: 30000, budget: {soft: 0.0002, hard: 0.0006}}
  veritas-key:         {id: veritas,   tenant: veritas,     tpm: 30000, budget: {soft: 2.00, hard: 5.00}}
  nexus-key:           {id: nexus,     tenant: nexus,       tpm: 30000, budget: {soft: 2.00, hard: 5.00}}

# Hard input bounds, checked before guardrails, caches or models (413 / 400 with a clear code).
limits:
  max_body_bytes: 1000000
  max_messages: 256
  max_prompt_tokens: 16000
  max_output_tokens: 4096

# Llama Guard 3 (1B on Ollama): input checked on cache misses (leader only), output checked in the
# background before an answer may be cached. ~110-150 ms warm. on_error: allow | block.
safety:
  enabled: true
  base_url: http://${AEGIS_MODEL_HOST:-127.0.0.1}:11434/v1
  model: llama-guard3:1b
  timeout_ms: 2500        # a cold model load is ~2 s; warm checks take ~60-150 ms
  on_error: allow
  check_output: true
  unsafe_threshold: 0.9   # P(unsafe) to block; measured: false positives 0.50-0.69, hazards >= 0.986

# Streaming output redaction: emails, phone numbers, Luhn-valid cards, API-key formats.
output_guard:
  redact: true

cache:
  ttl_seconds: 86400
  semantic_threshold: 0.95           # cosine similarity; a starting guess, tune on near-misses
  semantic_max_tokens: 200           # longer last messages (RAG prompts) get exact-match only
  embed_budget_ms: 300               # embedder slower than this: skip the semantic lookup

router:
  slot_wait_seconds: 2               # wait this long for a free slot, then try the next backend
  queue_deadline_seconds: 10         # nothing free in this long: 503 + Retry-After
  first_token_timeout_seconds: 15    # plus 1 s per 1k prompt tokens
  hedge_min_ms: 250                  # never hedge sooner than this
  hedge_default_ms: 2500             # hedge delay before a backend has enough TTFT samples
  chain_retries: 1                   # whole chain failed before a token: retry it once...
  retry_base_ms: 200                 # ...after a full-jitter exponential backoff (0..base*2^n ms)
  retry_cap_ms: 2000

breaker:
  error_threshold: 3                 # consecutive errors that open the breaker (fast path)
  failure_rate: 0.5                  # ...or this share of failures over the window
  window_seconds: 30
  min_requests: 10                   # ...once the window holds this many outcomes
  open_seconds: 30

chaos:
  auto_revert_seconds: 120
