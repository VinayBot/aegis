# A template, never applied as is: create the real secret from a secret manager, e.g.
#   kubectl -n aegis create secret generic aegis-secrets \
#     --from-literal=AEGIS_ADMIN_KEY="$(openssl rand -hex 32)" \
#     --from-literal=AEGIS_JWT_SECRET="$(openssl rand -hex 32)" \
#     --from-literal=LITELLM_MASTER_KEY=... \
#     --from-literal=AEGIS_LANGFUSE_PUBLIC_KEY=... --from-literal=AEGIS_LANGFUSE_SECRET_KEY=...
apiVersion: v1
kind: Secret
metadata:
  name: aegis-secrets
  namespace: aegis
type: Opaque
stringData:
  AEGIS_ADMIN_KEY: replace-me
  AEGIS_JWT_SECRET: replace-me
