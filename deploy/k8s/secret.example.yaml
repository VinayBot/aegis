# A template, never applied as is: create the real secret from a secret manager, e.g.
#   kubectl -n prahari create secret generic prahari-secrets \
#     --from-literal=PRAHARI_ADMIN_KEY="$(openssl rand -hex 32)" \
#     --from-literal=PRAHARI_JWT_SECRET="$(openssl rand -hex 32)" \
#     --from-literal=LITELLM_MASTER_KEY=... \
#     --from-literal=PRAHARI_LANGFUSE_PUBLIC_KEY=... --from-literal=PRAHARI_LANGFUSE_SECRET_KEY=...
apiVersion: v1
kind: Secret
metadata:
  name: prahari-secrets
  namespace: prahari
type: Opaque
stringData:
  PRAHARI_ADMIN_KEY: replace-me
  PRAHARI_JWT_SECRET: replace-me
