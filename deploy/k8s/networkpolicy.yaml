# Default deny, then only what the gateway needs: traffic in from the ingress controller and
# Prometheus; out to DNS, Redis, the OTel collector and the model servers.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: aegis-gateway
  namespace: aegis
spec:
  podSelector:
    matchLabels: {app.kubernetes.io/name: aegis-gateway}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: ingress-nginx}
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: monitoring}
      ports:
        - {protocol: TCP, port: 8000}
  egress:
    - to:
        - namespaceSelector: {}
          podSelector:
            matchLabels: {k8s-app: kube-dns}
      ports:
        - {protocol: UDP, port: 53}
        - {protocol: TCP, port: 53}
    - to:
        - podSelector:
            matchLabels: {app.kubernetes.io/name: redis}
      ports:
        - {protocol: TCP, port: 6379}
    - to:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: observability}
      ports:
        - {protocol: TCP, port: 4318}
    - to:
        - podSelector:
            matchLabels: {app.kubernetes.io/part-of: aegis-models}
      ports:
        - {protocol: TCP, port: 8081}
        - {protocol: TCP, port: 8090}
        - {protocol: TCP, port: 11434}
        - {protocol: TCP, port: 4000}
