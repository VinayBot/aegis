# 1. kubectl -n prahari create secret generic prahari-secrets ...      (see secret.example.yaml)
# 2. kubectl -n prahari create configmap prahari-gateway-yaml \
#      --from-file=gateway.yaml=backend/config/gateway.yaml          (keys as sha256: entries)
# 3. kubectl apply -k deploy/k8s
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: prahari
resources:
  - namespace.yaml
  - configmap.yaml
  - deployment.yaml
  - service.yaml
  - networkpolicy.yaml
