# Side systems for `make dev` (Redis Stack, Jaeger). The gateway runs natively on the Mac there.
# `--profile container` also runs the gateway image (Dockerfile) on :8001, in production mode,
# talking to the same Redis and Jaeger and to the model servers on the host.
name: aegis
services:
  redis:
    image: redis/redis-stack-server:7.4.0-v3
    ports: ["6379:6379"]
    environment:
      REDIS_ARGS: "--save '' --appendonly no --maxmemory 256mb --maxmemory-policy allkeys-lru"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10
    restart: unless-stopped
  jaeger:
    image: jaegertracing/jaeger:2.11.0
    ports:
      - "16686:16686"   # UI + query API
      - "4317:4317"     # OTLP gRPC
      - "4318:4318"     # OTLP HTTP
    restart: unless-stopped

  gateway:
    profiles: ["container"]
    build:
      context: ..
      dockerfile: Dockerfile
    image: aegis-gateway:local
    ports: ["127.0.0.1:8001:8000"]
    environment:
      AEGIS_ENV: production
      AEGIS_ADMIN_KEY: ${AEGIS_ADMIN_KEY:-}   # set it to use the control plane; empty = data plane only
      AEGIS_REDIS_URL: redis://redis:6379/0
      AEGIS_OTLP_ENDPOINT: http://jaeger:4318
      AEGIS_JAEGER_QUERY_URL: http://jaeger:16686
      AEGIS_SELF_URL: http://127.0.0.1:8000
      AEGIS_MODEL_HOST: host.docker.internal
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:-sk-aegis-local}
    extra_hosts: ["host.docker.internal:host-gateway"]
    depends_on:
      redis: {condition: service_healthy}
    read_only: true
    tmpfs: ["/tmp"]
    volumes: ["gateway-var:/app/var"]
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    restart: unless-stopped

volumes:
  gateway-var:
